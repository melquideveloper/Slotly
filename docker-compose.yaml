
services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME não definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER não definida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definida}

      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME não definida}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definida}

      MIGRATOR_USERNAME: ${MIGRATOR_USERNAME:?MIGRATOR_USERNAME não definida}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD não definida}

    volumes:
      - slotly-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: slotly:local
    container_name: slotly-app
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME não definida}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME não definida}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definida}

      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME não definida}
      SPRING_FLYWAY_USER: ${MIGRATOR_USERNAME:?MIGRATOR_USERNAME não definida}
      SPRING_FLYWAY_PASSWORD: ${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD não definida}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  slotly-postgres-data: