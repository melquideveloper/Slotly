
services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-slotly}
      POSTGRES_USER: ${DB_USERNAME:-slotly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slotly_dev}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - slotly-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: slotly:local
    container_name: slotly-app
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-slotly}
      DB_USERNAME: ${DB_USERNAME:-slotly}
      DB_PASSWORD: ${DB_PASSWORD:-slotly_dev}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  slotly-postgres-data:
