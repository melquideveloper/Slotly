name: Slotly CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

  integration-postgres:
    name: PostgreSQL Security Integration
    runs-on: ubuntu-latest

    needs: build

    env:
      POSTGRES_USER: slotly_admin
      POSTGRES_PASSWORD: slotly_admin_ci_password
      DB_NAME: slotly
      DB_USERNAME: slotly_app
      DB_PASSWORD: slotly_app_ci_password
      MIGRATOR_USERNAME: slotly_migrator
      MIGRATOR_PASSWORD: slotly_migrator_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker Compose
        run: |
          docker compose version
          chmod +x docker/postgres/init/01-create-app-user.sh

      - name: Start PostgreSQL and application
        run: docker compose up --build -d

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U "$POSTGRES_USER" -d "$DB_NAME"; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL failed to start."
          docker compose logs postgres
          exit 1

      - name: Wait for application health
        id: health
        continue-on-error: true
        run: |
          echo "Waiting for Slotly application..."

          for i in $(seq 1 30); do
            echo "Attempt $i/30"

            HTTP_CODE=$(curl \
              --silent \
              --output /tmp/health-response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 5 \
              http://localhost:8080/api/health || true)

            echo "HTTP Status: ${HTTP_CODE:-connection-error}"

            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/health-response.txt
              echo
              echo "Application is healthy."
              exit 0
            fi

            sleep 3
          done

          echo "Application health check failed."
          exit 1

      - name: Application diagnostics
        if: always()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose ps -a

          echo "===== APPLICATION LOGS ====="
          docker compose logs --no-color --tail=200 app || true

          echo "===== POSTGRESQL LOGS ====="
          docker compose logs --no-color --tail=200 postgres || true

      - name: Fail if application health check failed
        if: steps.health.outcome == 'failure'
        run: |
          echo "Application failed health verification."
          exit 1

      - name: Verify database roles and privileges
        run: |
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles
                  WHERE rolname = 'slotly_app'
                    AND rolcanlogin
              ) THEN
                  RAISE EXCEPTION 'Runtime role does not exist or cannot login';
              END IF;

              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles
                  WHERE rolname = 'slotly_migrator'
                    AND rolcanlogin
              ) THEN
                  RAISE EXCEPTION 'Migrator role does not exist or cannot login';
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM pg_roles
                  WHERE rolname IN ('slotly_app', 'slotly_migrator')
                    AND (
                        rolsuper
                        OR rolcreatedb
                        OR rolcreaterole
                        OR rolreplication
                        OR rolbypassrls
                    )
              ) THEN
                  RAISE EXCEPTION 'Application roles have excessive privileges';
              END IF;

              IF has_schema_privilege(
                  'slotly_app', 'public', 'CREATE'
              ) THEN
                  RAISE EXCEPTION 'Runtime user must not CREATE objects';
              END IF;

              IF NOT has_schema_privilege(
                  'slotly_app', 'public', 'USAGE'
              ) THEN
                  RAISE EXCEPTION 'Runtime user must have schema USAGE';
              END IF;

              IF NOT has_schema_privilege(
                  'slotly_migrator', 'public', 'CREATE'
              ) THEN
                  RAISE EXCEPTION 'Migrator must have schema CREATE';
              END IF;

              IF NOT has_table_privilege(
                  'slotly_app', 'organizations', 'SELECT'
              )
              OR NOT has_table_privilege(
                  'slotly_app', 'organizations', 'INSERT'
              )
              OR NOT has_table_privilege(
                  'slotly_app', 'organizations', 'UPDATE'
              )
              OR NOT has_table_privilege(
                  'slotly_app', 'organizations', 'DELETE'
              ) THEN
                  RAISE EXCEPTION 'Runtime table privileges are incomplete';
              END IF;

              RAISE NOTICE 'Database roles and privileges validated successfully.';
          END
          $$;

          SQL

      - name: Verify Flyway migration
        run: |
          echo "===== VERIFYING FLYWAY MIGRATIONS ====="

          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1
                  FROM flyway_schema_history
                  WHERE version = '1'
                    AND success = TRUE
              ) THEN
                  RAISE EXCEPTION 'Flyway migration V1 was not successfully applied';
              END IF;

              IF to_regclass('public.organizations') IS NULL THEN
                  RAISE EXCEPTION 'Organizations table does not exist';
              END IF;

              RAISE NOTICE 'Flyway migration V1 validated successfully.';
          END
          $$;

          SELECT installed_rank, version, description, success
          FROM flyway_schema_history
          ORDER BY installed_rank;

          SQL

      - name: Verify runtime CRUD permissions
        run: |
          echo "===== VERIFYING RUNTIME CRUD PERMISSIONS ====="

          docker compose exec -T postgres sh -ec '
            PGPASSWORD="$DB_PASSWORD" psql \
              -h 127.0.0.1 \
              -U "$DB_USERNAME" \
              -d "$DB_NAME" \
              -v ON_ERROR_STOP=1
          ' <<'SQL'

          BEGIN;

          INSERT INTO organizations (id, name, slug)
          VALUES (
              '00000000-0000-0000-0000-000000000001',
              'CI Test',
              'ci-test'
          );

          UPDATE organizations
          SET name = 'CI Test Updated'
          WHERE slug = 'ci-test';

          DELETE FROM organizations
          WHERE slug = 'ci-test';

          ROLLBACK;

          SQL

          echo "Runtime CRUD permissions validated successfully."

      - name: Verify runtime cannot create tables
        run: |
          echo "===== VERIFYING CREATE RESTRICTION ====="

          if docker compose exec -T postgres sh -ec '
            PGPASSWORD="$DB_PASSWORD" psql \
              -h 127.0.0.1 \
              -U "$DB_USERNAME" \
              -d "$DB_NAME" \
              -v ON_ERROR_STOP=1 \
              -c "CREATE TABLE public.runtime_forbidden_test (id integer)"
          '; then
            echo "ERROR: Runtime user unexpectedly created a table."
            exit 1
          else
            echo "SUCCESS: Runtime user cannot create tables."
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
