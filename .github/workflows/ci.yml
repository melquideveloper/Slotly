
name: Slotly CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

  integration-postgres:
    name: PostgreSQL Security Integration
    runs-on: ubuntu-latest

    needs: build

    env:
      POSTGRES_USER: slotly_admin
      POSTGRES_PASSWORD: slotly_admin_ci_password
      DB_NAME: slotly
      DB_USERNAME: slotly_app
      DB_PASSWORD: slotly_app_ci_password
      MIGRATOR_USERNAME: slotly_migrator
      MIGRATOR_PASSWORD: slotly_migrator_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL and application
        run: docker compose up --build -d

      - name: Wait for application health
        run: |
          curl --fail \
            --retry 20 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/api/health

      - name: Verify database roles and privileges
        run: |
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          BEGIN
              IF EXISTS (
                  SELECT 1
                  FROM pg_roles
                  WHERE rolname IN ('slotly_app', 'slotly_migrator')
                    AND (
                        rolsuper
                        OR rolcreatedb
                        OR rolcreaterole
                        OR rolreplication
                        OR rolbypassrls
                    )
              ) THEN
                  RAISE EXCEPTION 'Application roles have excessive privileges';
              END IF;

              IF has_schema_privilege('slotly_app', 'public', 'CREATE') THEN
                  RAISE EXCEPTION 'Runtime user must not CREATE objects';
              END IF;

              IF NOT has_schema_privilege('slotly_app', 'public', 'USAGE') THEN
                  RAISE EXCEPTION 'Runtime user must have schema USAGE';
              END IF;

              IF NOT has_schema_privilege('slotly_migrator', 'public', 'CREATE') THEN
                  RAISE EXCEPTION 'Migrator must have schema CREATE';
              END IF;

              IF NOT has_table_privilege('slotly_app', 'organizations', 'SELECT')
                 OR NOT has_table_privilege('slotly_app', 'organizations', 'INSERT')
                 OR NOT has_table_privilege('slotly_app', 'organizations', 'UPDATE')
                 OR NOT has_table_privilege('slotly_app', 'organizations', 'DELETE') THEN
                  RAISE EXCEPTION 'Runtime table privileges are incomplete';
              END IF;
          END
          $$;

          SQL

      - name: Verify runtime CRUD permissions
        run: |
          docker compose exec -T postgres sh -ec '
            PGPASSWORD="$DB_PASSWORD" psql \
              -h 127.0.0.1 \
              -U "$DB_USERNAME" \
              -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1
          ' <<'SQL'
          BEGIN;

          INSERT INTO organizations (id, name, slug)
          VALUES (
              '00000000-0000-0000-0000-000000000001',
              'CI Test',
              'ci-test'
          );

          UPDATE organizations
          SET name = 'CI Test Updated'
          WHERE slug = 'ci-test';

          DELETE FROM organizations
          WHERE slug = 'ci-test';

          ROLLBACK;
          SQL

      - name: Verify runtime cannot create tables
        run: |
          if docker compose exec -T postgres sh -ec '
            PGPASSWORD="$DB_PASSWORD" psql \
              -h 127.0.0.1 \
              -U "$DB_USERNAME" \
              -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 \
              -c "CREATE TABLE public.runtime_forbidden_test (id integer)"
          '; then
            echo "ERROR: Runtime user unexpectedly created a table"
            exit 1
          else
            echo "SUCCESS: Runtime user cannot create tables"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans