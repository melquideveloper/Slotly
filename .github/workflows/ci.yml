
name: Slotly CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

  integration-postgres:
    name: PostgreSQL Security Integration
    runs-on: ubuntu-latest

    needs: build

    env:
      POSTGRES_USER: slotly_admin
      POSTGRES_PASSWORD: slotly_admin_ci_password
      DB_NAME: slotly
      DB_USERNAME: slotly_app
      DB_PASSWORD: slotly_app_ci_password
      MIGRATOR_USERNAME: slotly_migrator
      MIGRATOR_PASSWORD: slotly_migrator_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          docker compose version
          chmod +x docker/postgres/init/01-create-app-user.sh
          chmod +x scripts/ci/*.sh

      - name: Start PostgreSQL and application
        run: docker compose up --build -d

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U "$POSTGRES_USER" -d "$DB_NAME"; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL failed to start."
          docker compose logs postgres
          exit 1

      - name: Wait for application health
        id: health
        continue-on-error: true
        run: |
          echo "Waiting for Slotly application..."

          for i in $(seq 1 30); do
            echo "Attempt $i/30"

            HTTP_CODE=$(curl \
              --silent \
              --output /tmp/health-response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 5 \
              http://localhost:8080/api/health || true)

            echo "HTTP Status: ${HTTP_CODE:-connection-error}"

            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/health-response.txt
              echo
              echo "Application is healthy."
              exit 0
            fi

            sleep 3
          done

          echo "Application health check failed."
          exit 1

      - name: Application diagnostics
        if: always()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose ps -a

          echo "===== APPLICATION LOGS ====="
          docker compose logs --no-color --tail=200 app || true

          echo "===== POSTGRESQL LOGS ====="
          docker compose logs --no-color --tail=200 postgres || true

      - name: Fail if application health check failed
        if: steps.health.outcome == 'failure'
        run: |
          echo "Application failed health verification."
          exit 1

      - name: Verify database security
        run: bash scripts/ci/verify-database-security.sh

      - name: Verify Flyway migrations
        run: bash scripts/ci/verify-flyway.sh

      - name: Verify runtime CRUD permissions
        run: bash scripts/ci/verify-runtime-crud.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
