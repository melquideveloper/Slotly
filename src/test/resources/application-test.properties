# H2 - Database exclusive to lightweight tests
spring.datasource.url=jdbc:h2:mem:slotly_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway disabled because PostgreSQL-specific migrations
# are validated against a real PostgreSQL instance in CI.
spring.flyway.enabled=false

# Test configuration
spring.main.banner-mode=off
