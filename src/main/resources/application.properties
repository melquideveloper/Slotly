spring.application.name=sapl-agendamento

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_manager}
spring.datasource.username=${DB_USERNAME:taskmanager}
spring.datasource.password=${DB_PASSWORD:taskmanager123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuration for Flyway (Database Migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
